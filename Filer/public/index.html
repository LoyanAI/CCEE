<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能文件管理系统</title>
    <script src="masonry.js"></script>
    <script src="mermaid.min.js"></script>
    <style>
/* 基础变量与重置 */
#fileView{
  overflow: auto;
}
:root {
    --bg: #0f172a;
    --card: rgba(15, 23, 42, .6);
    --border: rgba(94, 234, 212, .1);
    --accent: #5eead4;
    --radius: 10px;
    --gap: 10px;
}
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, var(--bg) 0%, #1e293b 100%);
    color: #e2e8f0;
    height: 100vh;
    overflow: hidden;
}

/* 布局骨架 */
.container {
    display: flex;
    height: 100vh;
}
.sidebar {
    width: 250px;
    background: var(--card);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: width .3s;
}
.sidebar.collapsed {
    width: 60px;
}
.main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    margin: 20px;
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
}

/* 顶部工具栏 */
.toolbar {
    padding: 15px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.btn {
    padding: 6px 12px;
    border: none;
    border-radius: 6px;
    background: rgba(56, 189, 248, .2);
    color: #e2e8f0;
    cursor: pointer;
    transition: background .2s;
}
.btn:hover {
    background: rgba(56, 189, 248, .3);
}

/* 文件夹树（折叠） */
.folder-tree {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
}
.folder-item {
    padding: 8px 10px;
    cursor: pointer;
    border-radius: 6px;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    transition: background .2s;
}
.folder-item:hover {
    background: rgba(94, 234, 212, .1);
}
.folder-item.active {
    background: rgba(94, 234, 212, .15);
}
.tree-arrow {
    margin-right: 4px;
    transition: transform .2s;
}
.tree-arrow.open {
    transform: rotate(90deg);
}
.tree-indent {
    margin-left: 20px;
}

/* 子文件夹栏 */
.sub-folder-bar {
    display: flex;
    flex-wrap: wrap;
    gap: var(--gap);
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
}
.sub-folder-card {
    background: rgba(30, 41, 59, .7);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    transition: background .2s, transform .2s;
}
.sub-folder-card:hover {
    background: rgba(56, 189, 248, .2);
    transform: translateY(-2px);
}


.file-strip {
    padding: 20px;
}
@media (max-width: 1200px) {
    .file-strip {
        column-count: 4;
    }
}
@media (max-width: 900px) {
    .file-strip {
        column-count: 3;
    }
}
@media (max-width: 600px) {
    .file-strip {
        column-count: 2;
    }
}
@media (max-width: 400px) {
    .file-strip {
        column-count: 1;
    }
}

.file-card {
    width: fit-content;         /* 固定宽（可媒体查询多档） */
    max-width: 512px;
    min-width: 128px;
    margin-bottom: 10px;  
    background: rgba(15,23,42,.6);
    border: 1px solid rgba(94,234,212,.1);
    border-radius: 10px;
    padding: 10px;
    cursor: pointer;
    transition: transform .2s, box-shadow .2s;
}
.file-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(2, 8, 20, .4);
}
.file-card.selected {
    border-color: #5eead4;
    box-shadow: 0 0 0 2px #5eead4;
}

/* 图片：只显示文件名 */
.file-card img {
    display: none;
}
.file-name {
    font-size: 13px;
    word-break: break-word;
    margin-top: 6px;
    text-align: center;
}

/* 文本：保持原样，自动撑开 */
.file-card pre {
    margin: 0;
    padding: 8px;
    font-family: Consolas, Monaco, monospace;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 60vh;
    overflow: auto;
}

/* 图标卡片（非图片/文本） */
.file-icon {
    width: 60px;
    height: 60px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: #fff;
    margin: 0 auto 8px;
}
.file-icon.txt { background: linear-gradient(135deg, #38bdf8, #0ea5e9); }
.file-icon.doc, .file-icon.docx { background: linear-gradient(135deg, #3b82f6, #2563eb); }
.file-icon.jpg, .file-icon.jpeg, .file-icon.png, .file-icon.gif { 
    background: linear-gradient(135deg, #34d399, #10b981);
}
.file-icon.pdf { background: linear-gradient(135deg, #f87171, #ef4444); }
.file-icon.zip, .file-icon.rar { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
.file-icon.default { background: linear-gradient(135deg, #94a3b8, #64748b); }

/* 其他元素 */
.toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--card);
    border: 1px solid var(--border);
    padding: 12px 24px;
    border-radius: 8px;
    display: none;
    align-items: center;
    gap: 10px;
    z-index: 3000;
}
.toast.show {
    display: flex;
}
.toast.error { color: #f87171; }
.toast.success { color: #34d399; }

/* 右键菜单 */
.context-menu {
    position: fixed;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px 0;
    display: none;
    z-index: 1500;
    min-width: 160px;
}
.context-menu-item {
    padding: 8px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
}
.context-menu-item:hover {
    background: rgba(94, 234, 212, .1);
}
.context-menu-separator {
    height: 1px;
    background: var(--border);
    margin: 4px 0;
}
/* ---- 遮罩+居中 ---- */
.dialog {
  position: fixed;
  inset: 0;
  background: rgba(2,8,20,.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 2000;
}
.dialog.active { display: flex; }

/* ---- 内容卡片 ---- */
.dialog-content {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  width: 90%;
  max-width: 400px;
  padding: 0;
  color: #e2e8f0;
}

.dialog-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  font-weight: 600;
}

.dialog-body {
  padding: 16px;
  line-height: 1.6;
}

.dialog-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  text-align: right;
}
.dialog-footer .btn { margin-left: 8px; }
.paste-bar{
  position:fixed; bottom:20px; left:50%;
  transform:translateX(-50%);
  background:var(--card); border:1px solid var(--border);
  border-radius:8px; padding:8px 14px; display:flex; gap:10px;
  align-items:center; z-index:2500;
}
/* ======== 新建 Markdown 弹窗专用 ======== */
#newMdDialog .dialog-content {
  width: 90%;
  max-width: 520px;          /* 比原来略宽，适合码字 */
  display: flex;
  flex-direction: column;
}

#newMdDialog .dialog-body {
  display: flex;
  flex-direction: column;
  gap: 12px;                 /* 标题与正文间距 */
}

#newMdDialog .dialog-input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: rgba(15, 23, 42, .8);
  color: #e2e8f0;
  font-family: inherit;
  font-size: 14px;
  transition: border-color .2s, box-shadow .2s;
}

#newMdDialog .dialog-input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(94, 234, 212, .25);
}

/* 只允许上下拖拽，避免左右拉爆布局 */
#newMdDialog textarea.dialog-input {
  resize: vertical;
  min-height: 180px;
}

/* 底部按钮区 */
#newMdDialog .dialog-footer {
  display: flex;
  justify-content: flex-end;
  gap: 8px;                  /* 替代原来的 margin-left */
}
    </style>
</head>
<body>

    <script>
var wpindex=0;

class FileManager {
  constructor() {
    this.currentFolder = '0';
    this.selectedFiles = new Set();
    this.clipboard = [];   // type: 'copy' | 'move'
    this.files = [];          // 当前列表
    this.subfolders=[];
    this.folders = [];        // 所有文件夹
    this.contextTarget = null; // 右键文件对象
    this.init();
  }

  init() {
    this.bindEvents();
    this.loadFolders();
    this.loadFiles();
  }

  bindEvents() {
    // 顶部工具栏「新建 Markdown」按钮
document.getElementById('newMdBtn').addEventListener('click', () => {
  document.getElementById('newMdDialog').classList.add('active');
  document.getElementById('newMdTitle').focus();
});

// 弹窗「取消」
document.getElementById('cancelNewMd').addEventListener('click', () => {
  document.getElementById('newMdDialog').classList.remove('active');
  document.getElementById('newMdTitle').value = '';
  document.getElementById('newMdContent').value = '';
});

// 弹窗「确定」
document.getElementById('confirmNewMd').addEventListener('click', async () => {
  const title = document.getElementById('newMdTitle').value.trim();
  const content = document.getElementById('newMdContent').value;
  if (!title) { fileManager.showToast('请输入文件名', 'error'); return; }

  const res = await fetch('/api/files/create-markdown', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ folderId: Number(fileManager.currentFolder), title, content })
  }).then(r => r.json());

  if (res.ok) {
    fileManager.showToast('Markdown 文件已创建', 'success');
    document.getElementById('newMdDialog').classList.remove('active');
    document.getElementById('newMdTitle').value = '';
    document.getElementById('newMdContent').value = '';
    fileManager.loadFiles();          // 刷新
  } else {
    fileManager.showToast('创建失败：' + res.error, 'error');
  }
});
    // 上传
    document.getElementById('uploadBtn').addEventListener('click', () => {
      document.getElementById('fileInput').click();
    });
    document.getElementById('fileInput').addEventListener('change', (e) => {
      this.handleUpload(e.target.files);
    });
    // 新建文件夹
    document.getElementById('newFolderBtn').addEventListener('click', () => {
      this.showNewFolderDialog();
    });
    // 刷新
    document.getElementById('refreshBtn').addEventListener('click', () => {
      this.loadFiles();
      this.showToast('已刷新', 'success');
    });
    // 搜索
    document.getElementById('searchInput').addEventListener('input', (e) => {
      this.searchFiles(e.target.value);
    });
    // 模态框关闭
    document.getElementById('modalClose').addEventListener('click', () => this.closeModal());
    document.getElementById('previewModal').addEventListener('click', (e) => {
      if (e.target.id === 'previewModal') this.closeModal();
    });
    // 右键菜单
    document.addEventListener('click', () => this.hideContextMenu());
    // 键盘
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Delete' && this.selectedFiles.size === 1) {
        const file = this.files.find(f => f.id === [...this.selectedFiles][0]);
        if (file) this.showRemoveDialog(file);
      }
      if (e.ctrlKey && e.key === 'a') {
        e.preventDefault();
        this.selectAll();
      }
    });
  }

  /* ---------- 数据获取 ---------- */
  async loadFolders() {
    const res = await fetch('/api/folders').then(r => r.json());
    this.folders = res.folders;
    this.renderFolders();
  }
  async loadFiles() {console.log("Loading Folder="+this.currentFolder)
    const url = `/api/files?folder=${this.currentFolder}`;
    const [resFiles, resSub] = await Promise.all([
        fetch(url).then(r => r.json()),
        fetch(`/api/folders/children/${this.currentFolder}`).then(r => r.json())
    ]);

    this.files = resFiles.files;
    this.renderFiles();
    this.renderSubFolders();              // 🔥渲染子文件夹
    //this.updateFolderCounts();
}
async renderSubFolders() {
  this.subfolders=(await fetch(`/api/folders/children/${this.currentFolder}`).then(r => r.json())).folders;
  var list=this.subfolders;
    const bar = document.getElementById('subFolderBar');
    bar.innerHTML = '';
    if (!list.length) { bar.style.display = 'none'; return; }

    bar.style.display = 'flex';
    list.forEach(f => {
        const card = document.createElement('div');
        card.className = 'sub-folder-card';
        card.innerHTML = `<span class="ico">📁</span><span>${f.name}</span>`;
        card.addEventListener('click', () => this.selectFolder(f.id));
        bar.appendChild(card);
    });
}

  /* ---------- 渲染 ---------- */
  renderFolders() {
  const box = document.getElementById('folderTree');
  box.innerHTML = '';

  fetch('/api/folders/tree')
    .then(r => r.json())
    .then(({ tree }) => {
      const root = document.createElement('div');
      const walk = (nodes, container, depth = 0) => {
        nodes.forEach(n => {
          const item = document.createElement('div');
          item.className = 'folder-item';
          item.dataset.folderId = n.id;
          if (String(n.id) === this.currentFolder) item.classList.add('active');

          item.innerHTML = `
            <span class="tree-arrow">></span>
            <span class="folder-icon">📁</span>
            <span class="folder-name">${n.name}</span>
          `;

          const arrow = item.querySelector('.tree-arrow');
          const subBox = document.createElement('div');
          subBox.className = 'tree-indent';
          subBox.style.display = 'none';

          // 折叠
          if (n.children?.length) {
            arrow.addEventListener('click', e => {
              e.stopPropagation();
              const open = arrow.classList.toggle('open');
              subBox.style.display = open ? 'block' : 'none';
            });
            walk(n.children, subBox, depth + 1);
          } else arrow.style.visibility = 'hidden';

          // 进入文件夹
          item.addEventListener('click', () => {
            this.selectFolder(n.id);
          });

          // 右键：新建子文件夹
          item.addEventListener('contextmenu', e => {
            e.preventDefault();
            if(confirm(`确定删除文件夹「${n.name}」？\n（子文件夹或文件存在时会被阻止）`)){
              fetch(`/api/folders/${n.id}`, {method:'DELETE'})
                .then(r=>r.json().then(d=>{return {ok:r.ok, data:d}}))
                .then(({ok,data})=>{
                  if(ok){ this.showToast('已删除','success'); this.loadFolders();}
                  else  { this.showToast(data.error||'删除失败','error');}
                });
            }
          });

          container.appendChild(item);
          container.appendChild(subBox);
        });
      };
      walk(tree, root);
      box.appendChild(root);
    });
}

  renderFiles() {
  const strip = document.getElementById('fileGrid');
  strip.innerHTML = '';
  wpindex=this.files.length;
  this.files.forEach((file) => {
    const cardId = `file-${file.id}`;
    let card = document.getElementById(cardId);

    // 第一次：创建节点
    if (!card) {
      card = document.createElement('div');
      card.id = cardId;
      card.className = 'file-card';
      card.innerHTML = `
        <div class="file-content"></div>
        <div class="file-name"></div>
      `;
      strip.appendChild(card);
    }

    // 仅更新内容和选中状态
    const ext = file.name.split('.').pop().toLowerCase();
    const isImg = ['jpg', 'jpeg', 'png', 'gif'].includes(ext);
    const ismd= ext=='md';
    const isTxt = ['txt', 'json', 'xml', 'js', 'ts', 'html', 'css'].includes(ext);

    let content = '';
    if (isImg) {
      content = '<div class="file-icon img">🖼️</div>';
    } else if(ismd){
      content = `<div id="md-${file.id}" style="max-height:60vh;overflow:auto;">加载中…</div>`;
      fetch(`/api/files/${file.id}/content`)
        .then(r => r.text())
        .then(t => {document.querySelector(`#md-${file.id}`).innerHTML=t;});
    }else if (isTxt && file.id) {
      content = `<pre id="txt-${file.id}" style="max-height:60vh;overflow:auto;">加载中…</pre>`;
      fetch(`/api/files/${file.id}/content`)
        .then(r => r.text())
        .then(t => document.getElementById(`txt-${file.id}`).textContent = t);
    } else {
      const iconClass = this.fileIconClass(ext);
      content = `<div class="file-icon ${iconClass}">${this.fileIcon(ext)}</div>`;
    }

    card.querySelector('.file-content').innerHTML = content;
    card.querySelector('.file-name').textContent = file.name;
    
// 在你现有的 requestAnimationFrame 外层加个 setTimeout
setTimeout(() => {
  requestAnimationFrame(() => {
    const naturalW = card.scrollWidth;
    const targetW = Math.ceil(naturalW / 64) * 64;
    card.style.width = targetW + 'px';
    console.log(card.scrollWidth);
    
    wpindex--;
    if(wpindex==0){
      const strip = document.getElementById('fileGrid');
      mermaid.run()
      requestAnimationFrame(() => {strip._masonry?.layout();})
    }
  });
}, 50);

    // 只切换选中样式
    card.classList.toggle('selected', this.selectedFiles.has(file.id));

    // 绑定事件（只绑一次）
    if (!card.dataset.clicked) {
      card.dataset.clicked = '1';
      card.addEventListener('click', (e) => {
        if (e.ctrlKey || e.metaKey) this.toggleFile(file.id);
        else this.selectSingle(file.id);
      });
      card.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        this.showContextMenu(e, file);
      });
    }
  });

  // 所有卡片已插入 DOM → 等浏览器布局完成 → 再初始化
requestAnimationFrame(() => {
  if (!strip._masonry) {
    strip._masonry = new Masonry(strip, {
      itemSelector: '.file-card',
      columnWidth: 64,           // 最小列宽
      gutter: 10,                 // 列间距
      fitWidth: true,             // 居中
      horizontalOrder: false      // 允许补空
    });
  } else {
    strip._masonry.reloadItems();
    strip._masonry.layout();
  }
});

}
  
  /* ---------- 业务逻辑 ---------- */
  selectFolder(id) {
    this.currentFolder = String(id);
    this.selectedFiles.clear();
    this.loadFiles();
  }
  toggleFile(id) {
  this.selectedFiles.has(id) ? this.selectedFiles.delete(id) : this.selectedFiles.add(id);
  // ❌ 删掉 this.renderFiles();
  document.getElementById(`file-${id}`)?.classList.toggle('selected', this.selectedFiles.has(id));
}
  selectSingle(id) {
    this.selectedFiles.forEach(oldId =>
    document.getElementById(`file-${oldId}`)?.classList.remove('selected')
  );
  this.selectedFiles.clear();
  this.selectedFiles.add(id);
  // ❌ 删掉 this.renderFiles();
  document.getElementById(`file-${id}`)?.classList.add('selected');
  }
  selectAll() {
    this.selectedFiles = new Set(this.files.map(f => f.id));
    this.renderFiles();
  }

  /* ---------- 右键菜单 ---------- */
  showContextMenu(e, file) {
    this.contextTarget = file;
    const menu = document.getElementById('contextMenu');
    menu.innerHTML = `
      <div class="context-menu-item" data-action="prop"><span>ℹ️</span> 属性</div>
      <div class="context-menu-item" data-action="copy"><span>📋</span> 复制</div>
      ${this.clipboard.length?`<div class="context-menu-item" data-action="paste"><span>Paste</span> 粘贴</div>`:''}
      <div class="context-menu-item" data-action="remove"><span>📤</span> 从文件夹移除</div>
      <div class="context-menu-separator"></div>
      <div class="context-menu-item" data-action="del"><span>🗑️</span> 彻底删除</div>
    `;
    menu.style.display = 'block';
    menu.style.left = e.pageX + 'px';
    menu.style.top = e.pageY + 'px';
    menu.querySelectorAll('[data-action]').forEach(item => {
      item.addEventListener('click', () => {
        const act = item.dataset.action;
        if (act === 'prop') this.showPropDialog(file);
        if(act==='copy') this.copyToClipboard(file.id,'copy');
        if(act==='paste') this.tryPasteToFolder(Number(this.currentFolder));
        if (act === 'remove') this.showRemoveDialog(file);
        if (act === 'del') this.permanentDelete(file);
        this.hideContextMenu();
      });
    });
  }
  copyToClipboard(fileIds, type){
    this.clipboard.push(fileIds)
    const n =this.clipboard.length;
    document.getElementById('pasteInfo').textContent =
      `已复制 ${n} 个文件，点击任意文件夹即可粘贴`;
    document.getElementById('pasteBar').style.display = 'flex';
  }

  cancelClipboard(){
    this.clipboard = [];
    document.getElementById('pasteBar').style.display = 'none';
  }

  // 统一入口：任意地方选中文件夹就尝试粘贴
  async tryPasteToFolder(folderId){
    const files  = this.clipboard;
    if (!files.length) return;          // 没有剪贴内容直接返回
    const url = `/api/files/copy-to-folder`
    const res = await fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ folderId:folderId, fileIds:files })
    }).then(r=>r.json());

    if (res.ok){
      this.showToast(`已成功复制到目标文件夹`,'success');
      this.loadFiles();                 // 刷新当前视图
      this.cancelClipboard();
    }else{
      this.showToast('操作失败','error');
    }
  }
  hideContextMenu() {
    document.getElementById('contextMenu').style.display = 'none';
  }

  /* ---------- 属性弹窗 ---------- */
  showPropDialog(file) {
    const html = `
      <div class="dialog active" id="propDialog">
        <div class="dialog-content" style="max-width:400px">
          <div class="dialog-header">文件属性</div>
          <div class="dialog-body">
            <b>名称：</b>${file.name}<br>
            <b>大小：</b>${(file.size / 1024).toFixed(2)} KB<br>
            <b>所在文件夹：</b>
            ${file.folders?.length ? file.folders.map(f => f.name).join('、') : '<i style="color:#999">未分类</i>'}
          </div>
          <div class="dialog-footer">
            <button class="btn" onclick="this.closest('.dialog').classList.remove('active')">关闭</button>
          </div>
        </div>
      </div>
    `;
    document.body.insertAdjacentHTML('beforeend', html);
  }

  /* ---------- 复制到文件夹 ---------- */
  showCopyDialog(file) {
    const opts = this.folders.map(f => `<label><input type="checkbox" value="${f.id}"> ${f.name}</label>`).join('<br>');
    const html = `
      <div class="dialog active" id="copyDialog">
        <div class="dialog-content" style="max-width:400px">
          <div class="dialog-header">复制到文件夹</div>
          <div class="dialog-body">${opts}</div>
          <div class="dialog-footer">
            <button class="btn" onclick="this.closest('.dialog').remove()">取消</button>
            <button class="btn btn-primary" onclick="fileManager.doCopy('${file.id}')">确定</button>
          </div>
        </div>
      </div>
    `;
    document.body.insertAdjacentHTML('beforeend', html);
  }
  async doCopy(fileId) {
    const boxes = Array.from(document.querySelectorAll('#copyDialog input[type=checkbox]:checked')).map(i => Number(i.value));
    if (!boxes.length) return this.showToast('未选择文件夹', 'error');
    const res = await fetch(`/api/files/${fileId}/copy-to-folders`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ folderIds: boxes })
    }).then(r => r.json());
    if (res.ok) {
      this.showToast('复制成功', 'success');
      this.loadFiles();
    } else this.showToast('复制失败', 'error');
    document.getElementById('copyDialog').remove();
  }

  /* ---------- 从文件夹移除 ---------- */
  showRemoveDialog(file) {
    if (!file.folders?.length) return this.showToast('文件未归类，无需移除', 'info');
    const opts = file.folders.map(f => `<label><input type="checkbox" value="${f.id}"> ${f.name}</label>`).join('<br>');
    const html = `
      <div class="dialog active" id="removeDialog">
        <div class="dialog-content" style="max-width:400px">
          <div class="dialog-header">从文件夹移除</div>
          <div class="dialog-body">${opts}</div>
          <div class="dialog-footer">
            <button class="btn" onclick="this.closest('.dialog').remove()">取消</button>
            <button class="btn btn-primary" onclick="fileManager.doRemove('${file.id}')">确定</button>
          </div>
        </div>
      </div>
    `;
    document.body.insertAdjacentHTML('beforeend', html);
  }
  async doRemove(fileId) {
    const boxes = Array.from(document.querySelectorAll('#removeDialog input[type=checkbox]:checked')).map(i => Number(i.value));
    if (!boxes.length) return this.showToast('未选择文件夹', 'error');
    const res = await fetch(`/api/files/${fileId}/remove-from-folder`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ folderIds: boxes })
    }).then(r => r.json());
    if (res.ok) {
      this.showToast('移除成功', 'success');
      this.loadFiles();
    } else this.showToast('移除失败', 'error');
    document.getElementById('removeDialog').remove();
  }

  /* ---------- 彻底删除 ---------- */
  async permanentDelete(file) {
    if (!confirm(`彻底删除文件「${file.name}」？\n（实体文件与所有文件夹关联将被清除）`)) return;
    const res = await fetch(`/api/files/${file.id}`, { method: 'DELETE' }).then(r => r.json());
    if (res.ok) {
      this.showToast('已彻底删除', 'success');
      this.selectedFiles.delete(file.id);
      this.loadFiles();
    } else this.showToast('删除失败', 'error');
  }

  /* ---------- 上传 ---------- */
  async handleUpload(files) {
  const fd = new FormData();
  Array.from(files).forEach(f => fd.append('files', f));
  // 当前不是「所有文件」就自动绑定
  fd.append('folders[]', this.currentFolder);
  const res = await fetch('/api/files/upload', { method: 'POST', body: fd }).then(r => r.json());
  this.showToast(`已上传 ${res.count} 个文件到当前文件夹`, 'success');
  this.loadFiles();
}

  /* ---------- 搜索 ---------- */
  searchFiles(q)  {
  const low = (q || '').toLowerCase();
  // 1. 先全部藏起来
  document.querySelectorAll('#fileGrid .file-card').forEach(card => {
    card.style.display = 'none';
  });
  // 2. 把匹配的露出来
  this.files.forEach(f => {
    if (f.name.toLowerCase().includes(low)) {
      const card = document.getElementById(`file-${f.id}`);
      if (card) card.style.display = '';   // 恢复显示
    }
  });
  // 3. 通知 Masonry 重新布局
  const strip = document.getElementById('fileGrid');
  strip._masonry?.layout();
}

  updateFolderCounts() {
    // 简单刷新侧边栏即可
    this.renderFolders();
  }

  /* ---------- 小工具 ---------- */
  fileIconClass(ext) {
    const map = { txt: 'txt', doc: 'doc', docx: 'doc', pdf: 'pdf', zip: 'zip', rar: 'zip' };
    return map[ext] || 'default';
  }
  fileIcon(ext) {
    const map = { txt: '📄', doc: '📝', docx: '📝', pdf: '📕', zip: '📦', rar: '📦' };
    return map[ext] || '📎';
  }
  showToast(msg, type = 'info') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    setTimeout(() => t.classList.remove('show'), 3000);
  }
  closeModal() {
    document.getElementById('previewModal').style.display = 'none';
  }
  showNewFolderDialog() {
  const name = prompt('新建文件夹名称：');
  if (!name) return;
  const parentId = Number(this.currentFolder);
  fetch('/api/folders', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, parentId })
  }).then(r => r.json()).then(() => {
    this.showToast('文件夹已创建', 'success');
    this.loadFolders(); // 重新渲染树
    this.renderSubFolders(); // 重新渲染树
  });
}
}
window.addEventListener('resize', () => {
  const strip = document.getElementById('fileGrid');
  strip._masonry?.layout();
});
// 启动
const fileManager = new FileManager();
document.getElementById('pasteCancel').onclick = () => fileManager.cancelClipboard();
mermaid.initialize({startOnLoad:true,theme:'dark'});
    </script>
